# Production compose file. Client is built as a static production bundle
# served by nginx, not the Vite dev server.
#
# Internal services (postgres/redis/redpanda/api/client/exporters) are NOT
# published to the host - only reachable on the internal Docker network.
# Traefik is the single public entry point for the app itself, on 80/443.
#
# Observability (otel-lgtm/Grafana, exporters, cadvisor, kminion,
# redpanda-console) is included too, all routed through Traefik on their
# own subdomains (grafana.mibo.monster, prometheus.mibo.monster,
# kafka.mibo.monster) - no ports published straight to the host. Grafana
# has its own login; Prometheus UI and Redpanda Console don't, so those two
# sit behind a shared Basic Auth middleware ("observability-auth") instead.
#
# Secrets fall back to dev placeholders if no `.env` is present - always
# provide a real `.env` (copy .env.example) before running this for real.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    # max_connections raised as a safety margin - PgBouncer (below) is what
    # actually absorbs concurrent load, so Postgres itself rarely sees more
    # than DEFAULT_POOL_SIZE real connections at once. shared_buffers tuned
    # for this host's RAM (default 128MB is sized for a tiny dev box).
    command: ["postgres", "-c", "max_connections=150", "-c", "shared_buffers=2GB", "-c", "effective_cache_size=4GB"]
    environment:
      POSTGRES_DB: behavioral_anticheat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d behavioral_anticheat"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Sits between api/worker and Postgres. Each HTTP request holds its EF
  # Core connection open for the request's full duration, so true
  # concurrency (not just sequential reuse) needs that many simultaneous
  # Postgres connections - transaction-mode pooling lets many more "logical"
  # client connections (api + worker combined) share a much smaller number
  # of real backend connections, since a backend is only checked out for
  # the duration of one transaction, not the whole request.
  pgbouncer:
    image: edoburu/pgbouncer:1.21.0-p2
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: behavioral_anticheat
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "40"
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # 32mb was sized for the old 458MB-RAM droplet; this host has 7.8GB.
    command: ["redis-server", "--maxmemory", "1gb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  redpanda:
    image: redpandadata/redpanda:latest
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 200M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092,OUTSIDE://localhost:19092
    volumes:
      - redpanda_data:/var/lib/redpanda/data

  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --providers.docker.constraints=Label(`com.docker.compose.project`, `${COMPOSE_PROJECT_NAME}`)
      - --entrypoints.web.address=:80
      # Every plain-HTTP request is redirected to HTTPS automatically - no
      # per-service router needed for this, it's handled once here.
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@example.com}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    depends_on:
      - api
      - client

  api:
    image: bae-api:prod
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`exam.mibo.monster`) && PathPrefix(`/api`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.api.priority=100"
      - "traefik.http.services.api.loadbalancer.server.port=8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=pgbouncer;Port=5432;Database=behavioral_anticheat;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}
      Redis__Configuration: redis:6379
      Kafka__BootstrapServers: redpanda:9092
      Kafka__BehavioralEventsTopic: behavioral-events
      Kafka__ConsumerGroupId: behavioral-anticheat-worker
      Jwt__AccessToken__SigningKey: ${JWT_ACCESS_SIGNING_KEY:-development-access-token-signing-key-change-before-production}
      Jwt__RefreshToken__SigningKey: ${JWT_REFRESH_SIGNING_KEY:-development-refresh-token-signing-key-change-before-production}
      SeedUsers__0__Email: admin@example.test
      SeedUsers__0__Password: ${SEED_ADMIN_PASSWORD:-Admin123!}
      SeedUsers__0__Role: Admin
      SeedUsers__1__Email: student@example.test
      SeedUsers__1__Password: ${SEED_STUDENT_PASSWORD:-Student123!}
      SeedUsers__1__Role: Student
      OpenTelemetry__OtlpEndpoint: http://otel-lgtm:4317
      OpenTelemetry__Environment: production
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      redpanda:
        condition: service_started
      otel-lgtm:
        condition: service_started

  worker:
    image: bae-worker:prod
    restart: unless-stopped
    environment:
      ConnectionStrings__DefaultConnection: Host=pgbouncer;Port=5432;Database=behavioral_anticheat;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}
      Redis__Configuration: redis:6379
      Kafka__BootstrapServers: redpanda:9092
      Kafka__BehavioralEventsTopic: behavioral-events
      Kafka__ConsumerGroupId: behavioral-anticheat-worker
      Jwt__AccessToken__SigningKey: ${JWT_ACCESS_SIGNING_KEY:-development-access-token-signing-key-change-before-production}
      Jwt__RefreshToken__SigningKey: ${JWT_REFRESH_SIGNING_KEY:-development-refresh-token-signing-key-change-before-production}
      OpenTelemetry__OtlpEndpoint: http://otel-lgtm:4317
      OpenTelemetry__Environment: production
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      redpanda:
        condition: service_started
      otel-lgtm:
        condition: service_started

  client:
    image: bae-client:prod
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.client.rule=Host(`exam.mibo.monster`) && PathPrefix(`/`)"
      - "traefik.http.routers.client.entrypoints=websecure"
      - "traefik.http.routers.client.tls.certresolver=letsencrypt"
      - "traefik.http.routers.client.priority=1"
      - "traefik.http.services.client.loadbalancer.server.port=80"
    depends_on:
      - api

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v3.10.0
    restart: unless-stopped
    environment:
      KAFKA_BROKERS: redpanda:9092
      REDPANDA_ADMINAPI_ENABLED: "true"
      REDPANDA_ADMINAPI_URLS: http://redpanda:9644
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.redpanda-console.rule=Host(`kafka.mibo.monster`)"
      - "traefik.http.routers.redpanda-console.entrypoints=websecure"
      - "traefik.http.routers.redpanda-console.tls.certresolver=letsencrypt"
      - "traefik.http.routers.redpanda-console.middlewares=observability-auth@docker"
      - "traefik.http.services.redpanda-console.loadbalancer.server.port=8080"
      # No built-in auth in redpanda-console itself - protected by the
      # observability-auth Basic Auth middleware defined below instead.
      - "traefik.http.middlewares.observability-auth.basicauth.users=admin:$$apr1$$bRpqusm8$$4nIZFO4zBsL3OyIwLJNjf0"
    depends_on:
      redpanda:
        condition: service_started

  # --- Observability stack -------------------------------------------------
  # Traces + metrics + logs from api/worker (via OTLP) plus infra/exporter
  # metrics (below) all land here.
  otel-lgtm:
    image: grafana/otel-lgtm:latest
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.mibo.monster`)"
      - "traefik.http.routers.prometheus.entrypoints=websecure"
      - "traefik.http.routers.prometheus.tls.certresolver=letsencrypt"
      - "traefik.http.routers.prometheus.middlewares=observability-auth@docker"
      - "traefik.http.routers.prometheus.service=prometheus"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"
      - "traefik.http.routers.grafana.rule=Host(`grafana.mibo.monster`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"
      - "traefik.http.routers.grafana.service=grafana"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme-before-live-test}
    volumes:
      - otel_lgtm_data:/data
      - ./observability/otelcol-config.yaml:/otel-lgtm/otelcol-config.yaml:ro
      - ./observability/grafana-dashboards-provisioning.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/custom.yaml:ro
      - ./observability/dashboards/behavioral-anticheat-overview.json:/otel-lgtm/grafana/conf/provisioning/dashboards/custom/behavioral-anticheat-overview.json:ro

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/behavioral_anticheat?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:latest
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis:6379
    depends_on:
      redis:
        condition: service_healthy

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    privileged: true
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  kminion:
    image: redpandadata/kminion:latest
    restart: unless-stopped
    environment:
      KAFKA_BROKERS: redpanda:9092
    depends_on:
      redpanda:
        condition: service_started
  # --------------------------------------------------------------------------

volumes:
  postgres_data:
  redpanda_data:
  traefik_letsencrypt:
  otel_lgtm_data:
